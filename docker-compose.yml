services:
  chat-connector:
    build: .
    image: chat-connector
    container_name: chat-connector
    restart: unless-stopped
    environment:
      PORT: 3000
    env_file: .env
    volumes:
      - ${SSL_DIR:?Set SSL_DIR in .env to the folder holding the certificate}:/app/ssl:ro
    ports:
      - '8443:3000'
    stop_grace_period: 15s
